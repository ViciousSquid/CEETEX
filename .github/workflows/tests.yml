name: CEETEX tests

on:
  push:
  pull_request:

# Keep the latest test run for each feature branch; superseded runs waste
# cross-platform runner capacity without improving merge safety.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pip install .
      - run: python -c "import importlib.metadata as m; assert m.version('ceetex') == '0.1.0'"
      - run: python -c "import os,tempfile; os.chdir(tempfile.gettempdir()); import ceetex, ceetex_classic, ceetex_teletext, ceetex_reading, ceetex_newswire; assert '101' in ceetex.TeletextApp().pages"
      - run: python -m pytest -q
      - run: python -m compileall -q ceetex.py ceetex_core.py ceetex_feed.py ceetex_cache.py ceetex_teletext.py ceetex_classic.py ceetex_newswire.py ceetex_reading.py
