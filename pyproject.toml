[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ceetex"
version = "0.1.0"
description = "A terminal Ceefax-style RSS and Atom reader"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "textual",
    "feedparser",
    "rich",
    "platformdirs>=4,<6",
]

[project.scripts]
ceetex = "ceetex:main"

[tool.setuptools]
py-modules = [
    "ceetex", "ceetex_core", "ceetex_feed", "ceetex_cache",
    "ceetex_teletext", "ceetex_classic", "ceetex_newswire", "ceetex_reading",
]

[tool.setuptools.packages.find]
include = ["ceetex_resources"]

[tool.setuptools.package-data]
ceetex_resources = ["pages.json"]
